[project]
name = "packages-notifier-backend"
version = "0.1.0"
description = "npm package update notifier backend - FastAPI + fastmcp on a single port"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false
